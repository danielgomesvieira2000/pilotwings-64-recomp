# N64Recomp config for Pilotwings 64 (USA).
#
# ELF input mode, on the decompilation's own matching build (tools/build_elf.sh).
# Every function arrives with its real name and size, so there is no symbol
# recovery here at all -- the config is only what the recompiler cannot know:
# where the entry point is, and which instructions touch hardware the runtime
# does not emulate.
#
# Paths are relative to this file.

[input]
elf_path = "../pilotwings64.us.elf"
entrypoint = 0x80200050
output_func_path = "../RecompiledFuncs"
functions_per_output_file = 50

# The decompilation's linker script names its bss sections "<segment>_bss"
# (.kernel_bss, .app_bss), which is what tells the recompiler that they belong
# to the code sections before them.
bss_section_suffix = "_bss"

# Read IDO's .mdebug debug information as well as the symbol table: it names the
# file-local functions (libultra's audio voice handlers among them) that are
# reached only through pointers in data and would otherwise never be recompiled.
# The mappings say which section each source file's code was linked into; see
# tools/gen_mdebug_mappings.py, which writes them.
use_mdebug = true
# BEGIN mdebug_file_mappings (generated by tools/gen_mdebug_mappings.py)
