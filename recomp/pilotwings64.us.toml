# N64Recomp config for Pilotwings 64 (USA).
#
# ELF input mode, on the decompilation's own matching build (tools/build_elf.sh).
# Every function arrives with its real name and size, so there is no symbol
# recovery here at all -- the config is only what the recompiler cannot know:
# where the entry point is, and which instructions touch hardware the runtime
# does not emulate.
#
# Paths are relative to this file.

[input]
elf_path = "../pilotwings64.us.elf"
entrypoint = 0x80200050
output_func_path = "../RecompiledFuncs"
functions_per_output_file = 50

# The decompilation's linker script names its bss sections "<segment>_bss"
# (.kernel_bss, .app_bss), which is what tells the recompiler that they belong
# to the code sections before them.
bss_section_suffix = "_bss"

# IDO's .mdebug debug information is read as well as the symbol table, for the
# file-local functions (libultra's audio voice handlers among them) that are
# reached only through pointers in data. That needs a mapping per source file,
# so tools/gen_mdebug_mappings.py writes pilotwings64.us.full.toml -- this file
# plus the mappings -- and the recompiler runs on that. Edit this one.

# The generated code calls the libultra functions the runtime reimplements
# under <name>_recomp, and funcs.h declares only what was recompiled.
# tools/gen_reimplemented_decls.py writes the declarations for the rest.
recomp_include = """#include "recomp.h"
#include "reimplemented_decls.h""""

[patches]
stubs = []

# Game functions replaced by the port's C patches (patches/*.c). Their original
# code is not emitted, so the patch is the only definition of the name: under
# clang-cl the recompiler's weak definitions become COMDATs on PE/COFF, which a
# second definition collides with instead of overriding. tools/build_patches.py
# refuses to build if a RECOMP_PATCH is missing from this list.
ignored = [
    "_uvScDoneGfx",     # patches/framerate.c
    "uvGfxBegin",       # patches/gfx.c
    "uvGfxClearScreen", # patches/gfx.c
    "uvVtxRect",        # patches/widescreen.c
    "uvVtxEndPoly",     # patches/widescreen.c
    "uvChan_80204C94",  # patches/widescreen.c
    "uvChan_80204D94",  # patches/widescreen.c
    "uvChan_80204FE4",  # patches/widescreen.c
    "hudDrawHangGlider",  # patches/hud.c
    "hudDrawRocketPack",  # patches/hud.c
    "hudDrawGyrocopter",  # patches/hud.c
    "hudDrawSkyDiving",   # patches/hud.c
    "hudDrawJumbleHopper",# patches/hud.c
    "hudDrawBirdman",     # patches/hud.c
    "hudDrawCamera",      # patches/hud.c
    "hudDrawBox",         # patches/hud.c
    "uvFontGenDlist",     # patches/hud.c
    "uvGfxMtxProjPushF",  # patches/interpolation.c
    "_uvDobjsDraw",       # patches/interpolation.c
    "uvDobj_8021771C",    # patches/interpolation.c
    "uvChan_80205CE4",    # patches/interpolation.c
    "_uvEnvDraw",         # patches/interpolation.c
    "uvClkGetSec",        # patches/clocks.c
]

# Three instructions touch hardware the runtime has no model of. Each is a nop
# in the port; the reason it is safe is given beside it. These are the same
# three gcsmith's Pilotwings64Recomp found; the addresses were checked against
# the decompilation's source here.

# _uvScDlistRecover writes SP_STATUS_REG to halt and reset the RSP after a
# display list overran its time budget. There is no RSP to reset: graphics
# tasks go to RT64 and never hang in the way this recovers from.
[[patches.instruction]]
func = "_uvScDlistRecover"
vram = 0x8022B678
value = 0x00000000 # sw $t6, 0x10($t7) -> nop

# func_80231A10 returns the CP0 Count register ($9) and reloads it from $a0 in
# its delay slot. The runtime keeps time on the host and has no Count register;
# nothing in the decompilation calls this function either, so it is dead code
# whose only effect on the port is that the recompiler refuses the instructions.
[[patches.instruction]]
func = "func_80231A10"
vram = 0x80231A10
value = 0x00000000 # mfc0 $v0, $9 -> nop

[[patches.instruction]]
func = "func_80231A10"
vram = 0x80231A18
value = 0x00000000 # mtc0 $v0, $9 -> nop
